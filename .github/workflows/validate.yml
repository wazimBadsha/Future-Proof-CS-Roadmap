name: Validate roadmap site

on:
  push:
    branches: [main, "roadmap/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate static site structure and accessibility basics
        run: python scripts/validate_site.py
      - name: Validate Vercel deployment script syntax
        run: bash -n scripts/deploy_vercel.sh
